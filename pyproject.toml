[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irodori"  
version = "0.1.0"
authors = [
  { name="Avani222", email="avanigupta2003@gmail.com" },
]
description = "A Python library for managing and analyzing hyperspectral data tables."
readme = "docs/README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "scipy>=1.7",
    "scikit-learn>=0.24",
    "opencv-python>=4.5",
    "PyWavelets>=1.1"
]

[project.urls]
Homepage = "https://github.com/Avani2222/project_irodori"
